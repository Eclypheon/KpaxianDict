<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2835" />
      <stop offset="100%" stop-color="#211a17" />
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7597" />
      <stop offset="50%" stop-color="#ff5c8d" />
      <stop offset="100%" stop-color="#bd93f9" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7ee16" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff79c6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#spaceGrad)" />

  <!-- Stars -->
  <circle cx="100" cy="110" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="410" cy="90" r="6" fill="#f7ee16" opacity="0.9" />
  <circle cx="80" cy="380" r="5" fill="#00ffff" opacity="0.7" />
  <circle cx="420" cy="400" r="4" fill="#ffffff" opacity="0.8" />

  <!-- Back Ring Segment -->
  <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="22" transform="rotate(-25 256 256)" opacity="0.4" />

  <!-- Planet Sphere -->
  <circle cx="256" cy="256" r="135" fill="url(#planetGrad)" filter="url(#glow)" />

  <!-- Friendly Alien Eyes -->
  <ellipse cx="215" cy="245" rx="14" ry="18" fill="#ffffff" />
  <circle cx="218" cy="242" r="7" fill="#4a2835" />
  <circle cx="214" cy="239" r="3" fill="#ffffff" />

  <ellipse cx="297" cy="245" rx="14" ry="18" fill="#ffffff" />
  <circle cx="300" cy="242" r="7" fill="#4a2835" />
  <circle cx="296" cy="239" r="3" fill="#ffffff" />

  <!-- Cute Smile -->
  <path d="M 238 275 Q 256 295 274 275" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Blush Spots -->
  <circle cx="190" cy="265" r="12" fill="#ffffff" opacity="0.35" />
  <circle cx="322" cy="265" r="12" fill="#ffffff" opacity="0.35" />

  <!-- Front Ring Segment -->
  <path d="M 80 308 A 200 60 0 0 0 432 204" fill="none" stroke="url(#ringGrad)" stroke-width="22" stroke-linecap="round" transform="rotate(-25 256 256)" />

  <!-- Mini Floating Bbychubi -->
  <g transform="translate(350, 110) scale(0.65)">
    <circle cx="50" cy="50" r="40" fill="#f7ee16" />
    <circle cx="38" cy="45" r="5" fill="#211a17" />
    <circle cx="62" cy="45" r="5" fill="#211a17" />
    <path d="M 45 58 Q 50 64 55 58" fill="none" stroke="#211a17" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
